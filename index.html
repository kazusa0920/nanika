<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <aside class="sidebar">
        <h1 class="logo">Snippet Stock</h1>
        <p>カテゴリー</p>

        <div class="category">
            <ul class="category-list">
                <li class="category-list-item">
                    <div class="category-list-item-left">
                        <div class="list-budge"></div>
                        <h3 class="category-title">すべて</h3>
                    </div>
                    <div class="count-label"><p>12</p></div>
                </li>
                <li class="category-list-item">
                    <div class="category-list-item-left">
                        <div class="list-budge"></div>
                        <h3 class="category-title">HTML</h3>
                    </div>
                    <div class="count-label"><p>5</p></div>
                </li>
                <li class="category-list-item">
                    <div class="category-list-item-left">
                        <div class="list-budge"></div>
                        <h3 class="category-title">CSS</h3>
                    </div>
                    <div class="count-label"><p>7</p></div>
                </li>
            </ul>
        </div>
    </aside>

    <main>
        <header class="header">
            <input type="text" placeholder="スニペットを検索…">
            <button id="addBtn" class="add-btn">＋ 新規追加</button>
        </header>

        <section class="card-section">
            <ul class="card-list">
                <li class="card-list-item">
                   <div class="card-header">
                    <h2>Flexboxで完全中央揃え</h2>
                    <div class="language-label">CSS</div>
                   </div>
                   
<pre><code>.container {
    display: flex;
    align-items: center;
    justify-content: center;
}</code></pre>
                   
                   <div class="card-footer">
                    <dd>2025-01-15</dd>

                    <div class="action-buttons">
                        <button class="icon-btn copy-btn" title="コピー">
                            <i class="fa-regular fa-copy"></i>
                        </button>
                        
                        <!-- 編集ボタン -->
                        <button class="icon-btn edit-btn" title="編集">
                            <i class="fa-regular fa-pen-to-square"></i>
                        </button>
                        
                        <!-- 削除ボタン -->
                        <button class="icon-btn delete-btn" title="削除">
                            <i class="fa-regular fa-trash-can"></i>
                        </button>
                    </div>
                   </div>
                </li>
            </ul>
        </section>
    </main>
</body>
</html>
